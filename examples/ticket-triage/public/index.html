<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Laya · ticket triage</title>
<style>
  :root {
    --bg: #0b0f1a; --panel: #141a2b; --panel-2: #1b2338; --line: #263153;
    --text: #e6ecff; --muted: #8a96b8; --accent: #6ea8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font: 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.2px; }
  h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  h3 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 10px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 12px; }
  input, textarea {
    display: block; width: 100%; margin-top: 6px; padding: 9px 11px; font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; resize: vertical;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .samples { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-size: 12px; }
  button.ghost:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--muted); font-size: 11.5px; }
  .reason { max-width: 320px; }
  .badge-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    font: 700 9px/1 ui-monospace, monospace; letter-spacing: 1.2px; text-transform: uppercase;
    padding: 5px 8px; border-radius: 999px; cursor: pointer; border: 1px solid transparent;
  }
  .badge-laya { background: #6ee7a8; color: #0b0f1a; }
  .badge-loading { background: rgba(110,168,255,.18); color: #cfe0ff; border-color: rgba(110,168,255,.5); }
  .badge-unavailable { background: rgba(239,68,68,.16); color: #ffb4b4; border-color: rgba(239,68,68,.45); }
  .badge-unknown { background: var(--panel-2); color: var(--muted); border-color: var(--line); }
  .answers { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 620px) { .answers { grid-template-columns: 1.4fr 1fr 1fr; } }
  .answer { margin: 0 0 8px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gate { font: 700 9px/1 ui-monospace, monospace; text-transform: uppercase; letter-spacing: 1px;
          background: rgba(250,204,21,.16); color: #fde68a; border: 1px solid rgba(250,204,21,.4);
          padding: 4px 7px; border-radius: 999px; }
  .error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); border-radius: 10px; padding: 12px; }
  .error strong { font: 700 10px/1 ui-monospace, monospace; text-transform: uppercase; letter-spacing: 1.2px; color: #ffb4b4; }
  .error p { margin: 8px 0 0; font-size: 12.5px; }
  code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 11px; }

  /* @laya-js/react components are unstyled; these are the class hooks. */
  .laya-breakdown { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .laya-breakdown-row { display: grid; grid-template-columns: 78px 1fr 34px; gap: 8px; align-items: center; font-size: 11.5px; }
  .laya-breakdown-row[data-chosen] { color: var(--text); font-weight: 700; }
  .laya-breakdown-label { color: var(--muted); }
  .laya-breakdown-row[data-chosen] .laya-breakdown-label { color: var(--text); }
  .laya-breakdown-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
  .laya-breakdown-bar::after {
    content: ''; position: absolute; inset: 0 auto 0 0; width: calc(var(--laya-p) * 100%);
    background: rgba(255,255,255,.3); border-radius: 3px;
  }
  .laya-breakdown-row[data-chosen] .laya-breakdown-bar::after { background: linear-gradient(90deg,#22d3ee,#6ea8ff); }
  .laya-breakdown-value { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .laya-score { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .laya-score-step { width: 22px; height: 6px; border-radius: 2px; background: rgba(255,255,255,.08); }
  .laya-score-step[data-on] { background: linear-gradient(90deg,#f59e0b,#ef4444); }
  .laya-score-label { margin-left: 6px; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
